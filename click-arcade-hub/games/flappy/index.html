<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flappy Bird | Arcade Hub</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="game-container">
    <div class="header">
      <a href="../../index.html" class="back-btn">⬅ Voltar ao Hub</a>
      <h1>🐤 Flappy Bird</h1>
    </div>

    <div class="scoreboard">
      <div>Pontos: <span id="score">0</span></div>
      <div>Recorde: <span id="high-score">0</span></div>
    </div>

    <div class="canvas-wrapper">
      <canvas id="flappyCanvas" width="360" height="480"></canvas>

      <!-- Overlay de Game Over / Start -->
      <div id="overlay" class="overlay">
        <h2 id="overlay-title">Flappy Bird</h2>
        <p id="overlay-msg">Clique ou Pressione 'Espaço' / 'Seta para Cima' para Voar</p>
        <button id="start-btn" onclick="startGame()">Jogar</button>
      </div>
    </div>

    <div class="controls-info">
      <p>Controles: <strong>Clique na tela</strong>, <strong>Espaço</strong> ou <strong>Seta Cima</strong></p>
    </div>
  </div>

  <script src="flappy.js"></script>
</body>
</html>
