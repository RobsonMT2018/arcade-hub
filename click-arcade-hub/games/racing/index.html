<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Turbo Dash 2D - Arcade Racing</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas" width="400" height="650"></canvas>
    
    <!-- HUD Superior -->
    <div id="ui">
      <div class="hud-box">
        <span class="hud-label">PONTOS</span>
        <span id="score">0</span>
      </div>
      <div class="hud-box">
        <span class="hud-label">RECORDE</span>
        <span id="high-score">0</span>
      </div>
      <div class="hud-box coin-hud">
        <span class="hud-label">MOEDAS</span>
        <span id="coins">0</span>
      </div>
    </div>

    <!-- Indicador de Power-up Ativo -->
    <div id="powerup-bar" class="hidden">
      <span id="powerup-name">TURBO</span>
      <div id="powerup-progress"></div>
    </div>

    <!-- Controles Touch na Parte Inferior (Esquerda / Direita) -->
    <div id="touch-controls">
      <button id="btn-left" class="touch-btn">◀</button>
      <button id="btn-right" class="touch-btn">▶</button>
    </div>

    <!-- Tela Inicial / Garagem de Seleção -->
    <div id="menu-screen">
      <h1 class="title">TURBO <span>DASH</span></h1>
      <p class="subtitle">Use A/D, Setas ou Botões para Jogar</p>
      
      <div class="shop-container">
        <h3>GARAGEM DE VEÍCULOS</h3>
        <div class="car-selector">
          <button id="prev-car" class="nav-btn">&lt;</button>
          
          <div id="car-preview-box">
            <!-- Canvas interativo para renderizar o carro escolhido -->
            <canvas id="previewCanvas" width="60" height="90"></canvas>
            <div id="car-details">
              <span id="car-name">Tanque Verde</span>
              <span id="car-status" class="status-owned">SELECIONADO</span>
            </div>
          </div>

          <button id="next-car" class="nav-btn">&gt;</button>
        </div>
        <button id="buy-btn" class="action-btn buy-action hidden">COMPRAR (50 🪙)</button>
      </div>

      <button id="start-btn" class="action-btn play-btn">JOGAR</button>
    </div>

    <!-- Tela de Game Over -->
    <div id="game-over-screen" class="hidden">
      <h1 class="danger-text">BATIDA!</h1>
      <div class="result-box">
        <p>Pontuação: <strong id="final-score">0</strong></p>
        <p>Moedas Coletadas: <strong id="final-coins">0</strong></p>
        <p class="new-record hidden" id="new-record-tag">🏆 NOVO RECORDE!</p>
      </div>
      <button id="restart-btn" class="action-btn">CORRER NOVAMENTE</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
