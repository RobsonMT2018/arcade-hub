<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Snake Game | Arcade Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&display=swap" rel="stylesheet">
   <link rel="stylesheet" href="./style.css" />
</head>
<body>

   
  <!-- Console Game Boy Vermelho -->
  <div class="gameboy-device">
    
    <!-- Cabeçalho do Console -->
    <div class="console-header">
      <div class="power-indicator">
        <span class="power-led"></span>
        <span class="power-label">POWER</span>
      </div>
      <div class="console-title">SNAKE GAME</div>
    </div>

    <!-- Moldura da Tela Bezel -->
    <div class="screen-bezel">
      
      <!-- Placar do Jogo -->
      <div class="scoreboard">
        <div>Pontos: <span id="score">0</span></div>
        <div>Speed: <span id="speed">1</span></div>
        <div>Recorde: <span id="high-score">0</span></div>
      </div>

      <!-- Canvas do Jogo -->
      <div class="canvas-wrapper">
        <canvas id="snakeCanvas" width="400" height="400"></canvas>
        
        <!-- Overlay de Game Over / Start -->
        <div id="overlay" class="overlay">
          <h2 id="overlay-title">Cobrinha Clássica</h2>
          <p id="overlay-msg">Pressione 'Espaço' ou clique abaixo para jogar</p>
          <button id="start-btn" onclick="startGame()">Jogar</button>
        </div>
      </div>
    </div>

    <!-- Seção dos Controles Virtuais -->
    <div class="controls-section">
      
      <!-- D-Pad em Cruz Direcional com Centro Vermelho -->
      <div class="dpad-container">
        <button class="dpad-btn dpad-up" id="btn-up" aria-label="Cima">↑</button>
        <button class="dpad-btn dpad-left" id="btn-left" aria-label="Esquerda">←</button>
        <div class="dpad-center"></div>
        <button class="dpad-btn dpad-right" id="btn-right" aria-label="Direita">→</button>
        <button class="dpad-btn dpad-down" id="btn-down" aria-label="Baixo">↓</button>
      </div>

      <!-- Botão de Pause do Lado Direito -->
      <div class="pause-container">
        <button class="pause-btn" id="btn-pause" aria-label="Pausa">⏸</button>
      </div>

    </div>

    <!-- Link para Voltar ao Hub -->
    <div class="hub-link-wrapper">
      <a href="../../index.html" class="back-btn">⬅ Voltar ao Hub</a>
    </div>

  </div>

  <script src="snake.js"></script>
</body>
</html>
