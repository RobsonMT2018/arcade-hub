<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Snake Game | Arcade Hub</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Estrutura principal do console Game Boy estilo arcade -->
  <div class="gameboy-device theme-gray">
    <!-- Cabeçalho com indicador de energia, botão de retorno e nome do jogo -->
    <div class="console-header">
      <div class="power-indicator">
        <span class="power-led"></span>
        <span class="power-label">POWER</span>
      </div>

      <a href="../../../index.html" class="back-hub-btn">
        <span>⁥-</span> Voltar ao Hub
      </a>

      <div class="console-title">SNAKE GAME</div>
    </div>

    <!-- Área interna da tela do console e painel do jogo -->
    <div class="screen-bezel">
      
      <!-- Placar com pontuação, velocidade, nível e recorde -->
      <div class="scoreboard">
        <div>Pontos: <span id="score">0</span></div>
        <div>Speed: <span id="speed">1</span></div>
        <div>Nível: <span id="level">1</span></div>
        <div>Recorde: <span id="high-score">0</span></div>
      </div>

      <!-- área do canvas onde o jogo é desenhado -->
      <div class="canvas-wrapper">
        <canvas id="snakeCanvas" width="400" height="400"></canvas>
        
        <!-- Sobreposição que mostra mensagens do jogo, como pausa, início e fim -->
        <div id="overlay" class="overlay">
          <h2 id="overlay-title">Fim de Jogo</h2>
          <p id="overlay-msg">Sua pontuação final foi: <span id="final-score">0</span></p>
        </div>
      </div>
    </div>

    <!-- Área inferior com os botões de controle do jogo -->
    <div class="controls-layout">
      
      <!-- Botão de pausa localizado à esquerda -->
      <div class="side-btn-wrapper left">
        <button class="action-btn" id="btn-pause" aria-label="Pausa">⏸</button>
      </div>

      <!-- D-pad central para mover a cobra em todas as direções -->
      <div class="dpad-container">
        <button class="dpad-btn dpad-up" id="btn-up" aria-label="Cima">↑</button>
        <button class="dpad-btn dpad-left" id="btn-left" aria-label="Esquerda">←</button>

        <button class="dpad-btn dpad-right" id="btn-right" aria-label="Direita">→</button>
        <button class="dpad-btn dpad-down" id="btn-down" aria-label="Baixo">↓</button>
      </div>

      <!-- Botão principal para iniciar ou reiniciar a partida -->
      <div class="side-btn-wrapper right">
        <button class="action-btn play-btn" id="start-btn" type="button" onclick="startGame()">▶</button>
      </div>

    </div>

  </div>

  <script src="snake.js" defer></script>
</body>
</html>
